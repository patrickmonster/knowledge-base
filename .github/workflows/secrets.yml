name: Secret checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked private configuration
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          forbidden = []
          for name in filter(None, files):
              p = pathlib.PurePosixPath(name)
              if ((p.name == ".env" or p.name.startswith(".env.")) and p.name != ".env.example"
                  or name == ".railway/deployment.json"
                  or p.name.endswith((".local.json", ".pem", ".key"))):
                  forbidden.append(name)
          if forbidden:
              print("Remove local/private files from Git:")
              print("\n".join(forbidden))
              sys.exit(1)
          PY
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 .
