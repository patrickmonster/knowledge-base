name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: knowledge_test
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:integration-test-only@localhost:5432/knowledge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/knowledge-base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci --prefix .railway
      - run: npm --prefix .railway run check
